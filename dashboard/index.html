<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - العروي للديكورات</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Readex Pro',sans-serif}
:root{--pri:#1a1a2e;--pri-l:#16213e;--acc:#e94560;--bg:#f5f5f5;--card:#fff;--txt:#333;--txt-l:#888;--border:#e0e0e0;--success:#4caf50;--radius:12px}
body{background:var(--bg);color:var(--txt);min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--pri),var(--pri-l))}
.login-box{background:var(--card);padding:40px;border-radius:var(--radius);width:380px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.login-box h1{text-align:center;margin-bottom:8px;font-size:22px}
.login-box p{text-align:center;color:var(--txt-l);margin-bottom:24px;font-size:14px}
.login-box input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;margin-bottom:16px;font-size:15px;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--acc)}
.login-box button{width:100%;padding:12px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:.2s}
.login-box button:hover{opacity:.9}
.login-box .error{color:var(--acc);text-align:center;margin-top:12px;font-size:14px}
.app{display:none}
.sidebar{position:fixed;right:0;top:0;width:240px;height:100vh;background:var(--pri);color:#fff;padding:20px 0;z-index:100}
.sidebar .logo{padding:0 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:18px;font-weight:700}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:rgba(255,255,255,.7);text-decoration:none;transition:.2s;font-size:14px}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:#fff}
.sidebar nav a .material-symbols-outlined{font-size:20px}
.main{margin-right:240px;padding:24px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.topbar h2{font-size:22px}
.topbar .logout{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card .label{font-size:13px;color:var(--txt-l);margin-bottom:4px}
.card .value{font-size:28px;font-weight:700}
.card .value.acc{color:var(--acc)}
table{width:100%;background:var(--card);border-radius:var(--radius);overflow:hidden;border-collapse:collapse;box-shadow:0 2px 8px rgba(0,0,0,.06)}
th,td{padding:12px 16px;text-align:right;font-size:14px;border-bottom:1px solid var(--border)}
th{background:var(--pri);color:#fff;font-weight:600}
tr:hover td{background:rgba(0,0,0,.02)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px}
.badge.green{background:#e8f5e9;color:#2e7d32}
.badge.yellow{background:#fff8e1;color:#f57f17}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:var(--pri);color:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:hover{opacity:.85}
.actions{display:flex;gap:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.form-group textarea{min-height:80px;resize:vertical}
.form-group input:focus,.form-group textarea:focus{border-color:var(--acc)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-full{grid-column:1/-1}
.page{display:none}
.page.active{display:block}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.img-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.img-card img{width:100%;height:140px;object-fit:cover}
.img-card .info{padding:12px}
.img-card .info p{font-size:13px;margin-bottom:4px}
.img-card .actions{margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#333;color:#fff;border-radius:8px;font-size:14px;z-index:9999;display:none}
.toast.show{display:block}
@media(max-width:768px){.sidebar{width:60px}.sidebar .logo,.sidebar nav a span{display:none}.sidebar nav a{justify-content:center}.main{margin-right:60px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginWrap" class="login-wrap">
<div class="login-box">
<h1>العروي للديكورات</h1>
<p>لوحة التحكم</p>
<input id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
<input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button onclick="doLogin()">تسجيل الدخول</button>
<div id="loginError" class="error"></div>
</div>
</div>
<div id="app" class="app">
<div class="sidebar">
<div class="logo">لوحة التحكم</div>
<nav>
<a href="#" class="active" data-page="dashboard"><span class="material-symbols-outlined">dashboard</span><span>الرئيسية</span></a>
<a href="#" data-page="settings"><span class="material-symbols-outlined">settings</span><span>الإعدادات</span></a>
<a href="#" data-page="services"><span class="material-symbols-outlined">design_services</span><span>الخدمات</span></a>
<a href="#" data-page="categories"><span class="material-symbols-outlined">category</span><span>الفئات</span></a>
<a href="#" data-page="gallery"><span class="material-symbols-outlined">photo_library</span><span>المعرض</span></a>
</nav>
</div>
<div class="main">
<div class="topbar"><h2 id="pageTitle">الرئيسية</h2><button class="logout" onclick="doLogout()">تسجيل الخروج</button></div>
<div id="pg-dashboard" class="page active"><div id="statsCards" class="cards"></div></div>
<div id="pg-settings" class="page"><form id="settingsForm" onsubmit="saveSettings(event)"></form></div>
<div id="pg-services" class="page"><div style="margin-bottom:16px"><button class="btn pri" onclick="showServiceForm()">+ خدمة جديدة</button></div><div id="servicesList"></div></div>
<div id="pg-categories" class="page"><div style="margin-bottom:16px"><button class="btn pri" onclick="showCategoryForm()">+ فئة جديدة</button></div><div id="categoriesList"></div></div>
<div id="pg-gallery" class="page"><div style="margin-bottom:16px"><input type="file" id="galleryFiles" multiple accept="image/*" onchange="uploadGallery(event)" style="display:none"><button class="btn pri" onclick="document.getElementById('galleryFiles').click()">+ رفع صور</button></div><div id="galleryGrid" class="img-grid"></div></div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
const API=window.location.origin+'/api';
let categories=[];
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...opts.headers},credentials:'include'});return r.json()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
async function doLogin(){const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;const r=await api('/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});if(r.error){document.getElementById('loginError').textContent=r.error}else{showApp()}}
async function doLogout(){await api('/auth/login?action=logout',{method:'POST'});location.reload()}
function showApp(){document.getElementById('loginWrap').style.display='none';document.getElementById('app').style.display='flex';loadDashboard()}
async function checkAuth(){const r=await api('/auth/login');if(r.authenticated)showApp()}
document.querySelectorAll('.sidebar nav a').forEach(a=>{a.onclick=e=>{e.preventDefault();document.querySelectorAll('.sidebar nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');const pg=a.dataset.page;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('pg-'+pg).classList.add('active');document.getElementById('pageTitle').textContent=a.querySelector('span:last-child').textContent;if(pg==='dashboard')loadDashboard();if(pg==='settings')loadSettings();if(pg==='services')loadServices();if(pg==='categories')loadCategories();if(pg==='gallery')loadGallery()}});
async function loadDashboard(){const s=await api('/admin/stats');document.getElementById('statsCards').innerHTML=`<div class="card"><div class="label">الخدمات المنشورة</div><div class="value acc">${s.servicesCount}</div></div><div class="card"><div class="label">إجمالي الخدمات</div><div class="value">${s.totalServicesCount}</div></div><div class="card"><div class="label">صور المعرض</div><div class="value acc">${s.galleryCount}</div></div><div class="card"><div class="label">نقرات التواصل</div><div class="value">${s.contactClicksCount}</div></div><div class="card"><div class="label">نقرات واتساب</div><div class="value">${s.whatsappClicksCount}</div></div><div class="card"><div class="label">نقرات آخر 7 أيام</div><div class="value acc">${s.recentClicks}</div></div>`}
async function loadSettings(){const s=await api('/admin/settings');const seo=s.seo||{};const an=s.analytics||{};document.getElementById('settingsForm').innerHTML=`<div class="form-grid"><div class="form-group"><label>اسم الموقع</label><input name="siteName" value="${s.site_name||''}"></div><div class="form-group"><label>الهاتف</label><input name="phone" value="${s.phone||''}"></div><div class="form-group"><label>واتساب</label><input name="whatsappUrl" value="${s.whatsapp_url||''}"></div><div class="form-group"><label>العنوان</label><input name="address" value="${s.address||''}"></div><div class="form-group"><label>سنوات الخبرة</label><input name="yearsExperience" type="number" value="${s.years_experience||0}"></div><div class="form-group"><label>المشاريع المنجزة</label><input name="totalProjects" type="number" value="${s.total_projects||0}"></div><div class="form-group"><label>نسبة الرضا</label><input name="satisfactionRate" type="number" value="${s.satisfaction_rate||0}"></div><div class="form-group"><label>رابط الانستغرام</label><input name="instagramUrl" value="${s.instagram_url||''}"></div><div class="form-group"><label>رابط تيك توك</label><input name="tiktokUrl" value="${s.tiktok_url||''}"></div><div class="form-group"><label>رابط سناب شات</label><input name="snapchatUrl" value="${s.snapchat_url||''}"></div><div class="form-group form-full"><label>عنوان Hero</label><input name="heroTitle" value="${s.hero_title||''}"></div><div class="form-group form-full"><label>عنوان فرعي Hero</label><input name="heroSubtitle" value="${s.hero_subtitle||''}"></div><div class="form-group form-full"><label>وصف Hero</label><textarea name="heroDescription">${s.hero_description||''}</textarea></div><div class="form-group form-full"><label>صورة Hero (URL)</label><input name="heroImageUrl" value="${s.hero_image_url||''}"></div><h3 style="grid-column:1/-1;margin-top:16px">SEO</h3><div class="form-group"><label>Meta Title</label><input name="seo.metaTitle" value="${seo.meta_title||''}"></div><div class="form-group"><label>Meta Description</label><input name="seo.metaDescription" value="${seo.meta_description||''}"></div><div class="form-group"><label>OG Title</label><input name="seo.ogTitle" value="${seo.og_title||''}"></div><div class="form-group"><label>OG Description</label><input name="seo.ogDescription" value="${seo.og_description||''}"></div><h3 style="grid-column:1/-1;margin-top:16px">Analytics</h3><div class="form-group"><label>Google Analytics ID</label><input name="analytics.googleAnalyticsId" value="${an.google_analytics_id||''}"></div><div class="form-group"><label>Google Ads Tag</label><input name="analytics.googleAdsTag" value="${an.google_ads_tag||''}"></div><div class="form-group"><label>Meta Pixel ID</label><input name="analytics.metaPixelId" value="${an.meta_pixel_id||''}"></div><div class="form-group"><label>Snap Pixel ID</label><input name="analytics.snapPixelId" value="${an.snap_pixel_id||''}"></div><div class="form-group form-full"><label>Header Scripts</label><textarea name="analytics.headerScripts">${an.header_scripts||''}</textarea></div></div><button type="submit" class="btn pri" style="margin-top:16px">حفظ الإعدادات</button>`}
async function saveSettings(e){e.preventDefault();const fd=new FormData(e.target);const data={seo:{},analytics:{}};fd.forEach((v,k)=>{if(k.startsWith('seo.')){data.seo[k.slice(4)]=v}else if(k.startsWith('analytics.')){data.analytics[k.slice(10)]=v}else{data[k]=v}});const r=await api('/admin/settings',{method:'POST',body:JSON.stringify(data)});toast(r.success?'تم الحفظ':'خطأ')}
async function loadServices(){const s=await api('/admin/services');let h='<table><tr><th>الاسم</th><th>الحالة</th><th>الترتيب</th><th>إجراءات</th></tr>';s.forEach(sv=>{h+=`<tr><td>${sv.name}</td><td><span class="badge ${sv.status==='published'?'green':'yellow'}">${sv.status==='published'?'منشور':'مسودة'}</span></td><td>${sv.sort_order}</td><td class="actions"><button class="btn sm sec" onclick="editService(${sv.id})">تعديل</button><button class="btn sm pri" onclick="delService(${sv.id})">حذف</button></td></tr>`});h+='</table>';document.getElementById('servicesList').innerHTML=h}
async function loadCategories(){categories=await api('/admin/categories');let h='<table><tr><th>الاسم</th><th>Slug</th><th>خدمات</th><th>صور</th><th>إجراءات</th></tr>';categories.forEach(c=>{h+=`<tr><td>${c.name}</td><td>${c.slug}</td><td>${c.service_count??0}</td><td>${c.image_count??0}</td><td class="actions"><button class="btn sm sec" onclick="editCategory(${c.id})">تعديل</button><button class="btn sm pri" onclick="delCategory(${c.id})">حذف</button></td></tr>`});h+='</table>';document.getElementById('categoriesList').innerHTML=h}
async function loadGallery(){const imgs=await api('/admin/gallery');let h='';imgs.forEach(img=>{h+=`<div class="img-card"><img src="${img.image_url}" alt="${img.alt_text||''}" loading="lazy"><div class="info"><p>${img.title||'بدون عنوان'}</p><div class="actions"><button class="btn sm sec" onclick="editImage(${img.id})">تعديل</button><button class="btn sm pri" onclick="delImage(${img.id})">حذف</button></div></div></div>`});document.getElementById('galleryGrid').innerHTML=h||'<p>لا توجد صور بعد</p>'}
async function uploadGallery(e){const files=e.target.files;if(!files.length)return;for(const f of files){const fd=new FormData();fd.append('file',f);fd.append('folder','gallery');const r=await fetch(API+'/admin/upload',{method:'POST',body:fd,credentials:'include'});const d=await r.json();if(d.success){await api('/admin/gallery',{method:'POST',body:JSON.stringify({imageUrl:d.url,title:f.name.replace(/\.[^.]+$/,''),sortOrder:0})})}}toast('تم رفع الصور');loadGallery()}
async function delImage(id){if(!confirm('حذف الصورة؟'))return;await api('/admin/gallery/'+id,{method:'DELETE'});toast('تم الحذف');loadGallery()}
async function delService(id){if(!confirm('حذف الخدمة؟'))return;await api('/admin/services/'+id,{method:'DELETE'});toast('تم الحذف');loadServices()}
async function delCategory(id){if(!confirm('حذف الفئة؟'))return;await api('/admin/categories?id='+id,{method:'DELETE'});toast('تم الحذف');loadCategories()}
function showServiceForm(){const cats=categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');const html=`<div style="background:var(--card);padding:24px;border-radius:var(--radius);margin-bottom:16px"><h3 style="margin-bottom:16px">خدمة جديدة</h3><div class="form-grid"><div class="form-group"><label>الاسم</label><input id="svName"></div><div class="form-group"><label>Slug</label><input id="svSlug"></div><div class="form-group"><label>الحالة</label><select id="svStatus"><option value="draft">مسودة</option><option value="published">منشور</option></select></div><div class="form-group"><label>الترتيب</label><input id="svSort" type="number" value="0"></div><div class="form-group"><label>الفئة</label><select id="svCat"><option value="">بدون</option>${cats}</select></div><div class="form-group form-full"><label>الوصف</label><textarea id="svDesc"></textarea></div></div><button class="btn pri" onclick="createService()">إنشاء</button> <button class="btn sec" onclick="loadServices()">إلغاء</button></div>`;document.getElementById('servicesList').insertAdjacentHTML('beforebegin',html)}
async function createService(){const r=await api('/admin/services',{method:'POST',body:JSON.stringify({name:document.getElementById('svName').value,slug:document.getElementById('svSlug').value,status:document.getElementById('svStatus').value,sortOrder:+document.getElementById('svSort').value,categoryId:document.getElementById('svCat').value||null,description:document.getElementById('svDesc').value})});toast(r.success?'تم الإنشاء':'خطأ');loadServices()}
function showCategoryForm(){const html=`<div style="background:var(--card);padding:24px;border-radius:var(--radius);margin-bottom:16px"><h3 style="margin-bottom:16px">فئة جديدة</h3><div class="form-grid"><div class="form-group"><label>الاسم</label><input id="catName"></div><div class="form-group"><label>Slug</label><input id="catSlug"></div><div class="form-group"><label>الترتيب</label><input id="catSort" type="number" value="0"></div><div class="form-group form-full"><label>الوصف</label><textarea id="catDesc"></textarea></div></div><button class="btn pri" onclick="createCategory()">إنشاء</button> <button class="btn sec" onclick="loadCategories()">إلغاء</button></div>`;document.getElementById('categoriesList').insertAdjacentHTML('beforebegin',html)}
async function createCategory(){const r=await api('/admin/categories',{method:'POST',body:JSON.stringify({name:document.getElementById('catName').value,slug:document.getElementById('catSlug').value,sortOrder:+document.getElementById('catSort').value,description:document.getElementById('catDesc').value})});toast(r.success?'تم الإنشاء':'خطأ');loadCategories()}
async function editService(id){const sv=await api('/admin/services/'+id);const cats=categories.map(c=>`<option value="${c.id}" ${c.id==sv.category_id?'selected':''}>${c.name}</option>`).join('');const html=`<div style="background:var(--card);padding:24px;border-radius:var(--radius);margin-bottom:16px"><h3 style="margin-bottom:16px">تعديل الخدمة</h3><div class="form-grid"><div class="form-group"><label>الاسم</label><input id="esvName" value="${sv.name}"></div><div class="form-group"><label>Slug</label><input id="esvSlug" value="${sv.slug}"></div><div class="form-group"><label>الحالة</label><select id="esvStatus"><option value="draft" ${sv.status==='draft'?'selected':''}>مسودة</option><option value="published" ${sv.status==='published'?'selected':''}>منشور</option></select></div><div class="form-group"><label>الترتيب</label><input id="esvSort" type="number" value="${sv.sort_order}"></div><div class="form-group"><label>الفئة</label><select id="esvCat"><option value="">بدون</option>${cats}</select></div><div class="form-group form-full"><label>الوصف</label><textarea id="esvDesc">${sv.description||''}</textarea></div></div><button class="btn pri" onclick="updateService(${id})">حفظ</button> <button class="btn sec" onclick="loadServices()">إلغاء</button></div>`;document.getElementById('servicesList').insertAdjacentHTML('beforebegin',html)}
async function updateService(id){const r=await api('/admin/services/'+id,{method:'PATCH',body:JSON.stringify({name:document.getElementById('esvName').value,slug:document.getElementById('esvSlug').value,status:document.getElementById('esvStatus').value,sortOrder:+document.getElementById('esvSort').value,categoryId:document.getElementById('esvCat').value||null,description:document.getElementById('esvDesc').value})});toast(r.success?'تم التحديث':'خطأ');loadServices()}
async function editCategory(id){const c=categories.find(x=>x.id===id);const html=`<div style="background:var(--card);padding:24px;border-radius:var(--radius);margin-bottom:16px"><h3 style="margin-bottom:16px">تعديل الفئة</h3><div class="form-grid"><div class="form-group"><label>الاسم</label><input id="ecatName" value="${c.name}"></div><div class="form-group"><label>Slug</label><input id="ecatSlug" value="${c.slug}"></div><div class="form-group"><label>الترتيب</label><input id="ecatSort" type="number" value="${c.sort_order}"></div><div class="form-group form-full"><label>الوصف</label><textarea id="ecatDesc">${c.description||''}</textarea></div></div><button class="btn pri" onclick="updateCategory(${id})">حفظ</button> <button class="btn sec" onclick="loadCategories()">إلغاء</button></div>`;document.getElementById('categoriesList').insertAdjacentHTML('beforebegin',html)}
async function updateCategory(id){const r=await api('/admin/categories',{method:'PUT',body:JSON.stringify({id,name:document.getElementById('ecatName').value,slug:document.getElementById('ecatSlug').value,sortOrder:+document.getElementById('ecatSort').value,description:document.getElementById('ecatDesc').value})});toast(r.success?'تم التحديث':'خطأ');loadCategories()}
async function editImage(id){const imgs=await api('/admin/gallery');const img=imgs.find(x=>x.id===id);if(!img)return;const title=prompt('عنوان الصورة:',img.title||'');if(title===null)return;await api('/admin/gallery/'+id,{method:'PATCH',body:JSON.stringify({title})});toast('تم التحديث');loadGallery()}
checkAuth();
</script>
</body>
</html>
